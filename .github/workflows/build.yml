name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, hori-diagnostic]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-35 build-tools;35.0.0

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 8.9
        cache-disabled: true

    - name: Test, lint, and build installable APKs
      run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :magicshine-sniffer:assembleDebug --stacktrace -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GPR_KEY || github.token }}
      env:
        GPR_USER: ${{ github.actor }}
        GPR_KEY: ${{ secrets.GPR_KEY || github.token }}

    - name: Upload debug APKs
      uses: actions/upload-artifact@v6
      with:
        name: debug-apks
        path: |
          app/build/outputs/apk/debug/*.apk
          magicshine-sniffer/build/outputs/apk/debug/*.apk

    - name: Publish Karoo release APK
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(grep -o 'versionName "[^"]*"' app/build.gradle | cut -d'"' -f2)
        TAG="v$VERSION"
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --clobber
        else
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --title "Hori 1300 Controls v$VERSION" \
            --notes "Hori 1300 Controls v$VERSION"
        fi
