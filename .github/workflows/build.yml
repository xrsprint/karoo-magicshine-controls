name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-35 build-tools;35.0.0

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 8.9
        cache-disabled: true

    - name: Test, lint, and build installable APKs
      run: gradle :app:testDebugUnitTest :app:lintDebug assembleDebug --stacktrace -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GPR_KEY || github.token }}
      env:
        GPR_USER: ${{ github.actor }}
        GPR_KEY: ${{ secrets.GPR_KEY || github.token }}

    - name: Upload debug APK
      uses: actions/upload-artifact@v6
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk


    - name: Publish Karoo release APK
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view v1.4 >/dev/null 2>&1; then
          gh release upload v1.4 app/build/outputs/apk/debug/*.apk --clobber
        else
          gh release create v1.4 app/build/outputs/apk/debug/*.apk \
            --title "Hori 1300 Controls v1.4" \
            --notes "Hori 1300 Controls v1.4"
        fi
